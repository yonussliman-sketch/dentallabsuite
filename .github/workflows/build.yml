name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        id: project
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z"; done
          S=$(find . -name settings.gradle -not -path '*/.*' | head -n 1)
          if [ -z "$S" ]; then
            echo "::error::settings.gradle not found"
            exit 1
          fi
          P=$(dirname "$S")
          echo "path=$P" >> "$GITHUB_OUTPUT"

      - name: Firebase json
        run: |
          P="${{ steps.project.outputs.path }}"
          for m in clinic lab; do
            if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
              mkdir -p "$P/$m"
              printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON }}" > "$P/$m/google-services.json"
            fi
          done

      - name: Fix missing app_name in core strings
        run: |
          P="${{ steps.project.outputs.path }}"
          STR_FILE="$P/core/src/main/res/values/strings.xml"
          if [ -f "$STR_FILE" ] && ! grep -q 'name="app_name"' "$STR_FILE"; then
            sed -i 's|</resources>|    <string name="app_name">DentalLab Suite</string>\n</resources>|' "$STR_FILE"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          P="${{ steps.project.outputs.path }}"
          cd "$P" && gradle :clinic:assembleDebug :lab:assembleDebug --no-daemon

      - name: Collect
        run: |
          mkdir -p dist
          P="${{ steps.project.outputs.path }}"
          find "$P/clinic/build/outputs/apk/debug" -name "*.apk" -exec cp {} dist/DentalLab-Clinics.apk \; 2>/dev/null || true
          find "$P/lab/build/outputs/apk/debug" -name "*.apk" -exec cp {} dist/DentalLab-Lab.apk \; 2>/dev/null || true
          ls -lh dist/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DentalLab-APKs
          path: dist/*.apk
          if-no-files-found: error
